name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      # pygame/cv2 need a video + audio driver; use headless dummies in CI
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create environment and install core deps
        # Install only the base dependencies (no optional sensor extras, which
        # require native SDKs and won't build in CI).
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e .
          uv pip install ruff

      - name: Lint (ruff)
        run: uv run --no-sync ruff check .

      - name: Import smoke test
        shell: bash
        run: |
          uv run --no-sync python -c "
          import importlib, sys
          mods = [
              'bridge', 'creatures', 'day_night', 'dem_loader', 'depth_server',
              'depth_source', 'diagnostics', 'earthquake', 'ecosystem',
              'game_modes', 'interaction_engine', 'renderer', 'sensor_api',
              'sounds', 'timelapse', 'ui', 'volcano', 'webcam_observer', 'ai_guide', 'main',
          ]
          failed = []
          for m in mods:
              try:
                  importlib.import_module(m)
              except Exception as exc:
                  failed.append(f'{m}: {type(exc).__name__}: {exc}')
          if failed:
              print('Import failures:')
              for f in failed:
                  print('  ' + f)
              sys.exit(1)
          print(f'All {len(mods)} modules imported cleanly.')
          "

      - name: Launch smoke test
        run: uv run --no-sync python smoke_headless.py 30

      - name: Unit tests
        run: uv run --no-sync python -m unittest test_ai_guide test_vision test_bridge test_creatures test_volcano test_sensor_api test_game_modes test_renderer test_depth_server test_ui test_terrain_io -v
