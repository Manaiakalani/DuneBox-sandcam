[project]
name = "sandcam"
version = "0.1.0"
description = "AR sandbox POC — mouse-sculpted terrain with elevation rendering"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.4",
    "opencv-contrib-python>=4.11.0.86",
    "pygame>=2.6.1",
    "scipy>=1.17.1",
    "segno>=1.6",
    "websockets>=13.0",
]

[project.optional-dependencies]
geo = ["rasterio>=1.3"]
# kinect_v2_sdk backend (Windows SDK + pykinect2) - builds on Windows without native deps
kinect-v2 = ["pykinect2>=0.1.0", "comtypes>=1.1"]
orbbec = ["pyorbbecsdk>=1.0"]
realsense = ["pyrealsense2>=2.50"]
azure = ["pyk4a>=1.5"]
# all-sensors uses pykinect2 for Kinect V2 (works on Windows)
# NOTE: For the native pylibfreenect2-based kinect_v2 backend (Linux), install manually:
#       pip install pylibfreenect2 (requires libfreenect2 native headers)
all-sensors = ["pykinect2>=0.1.0", "comtypes>=1.1", "pyorbbecsdk>=1.0", "pyrealsense2>=2.50", "pyk4a>=1.5"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# sandcam runs as a flat collection of scripts (entry: `python main.py`),
# not an importable package — so disable package auto-discovery. Installing
# the project (`pip install -e .`) then just resolves the dependencies above.
py-modules = []

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Pinned so a new ruff release can't widen its default rule set under CI.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Asset-generation dev scripts keep scratch locals for readability/tuning.
"generate_placeholder_sounds.py" = ["F841"]
"generate_terrains.py" = ["F841"]
