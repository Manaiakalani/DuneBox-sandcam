[project]
name = "sandcam"
version = "0.1.0"
description = "AR sandbox POC — mouse-sculpted terrain with elevation rendering"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.4",
    "opencv-contrib-python>=4.11.0.86",
    "pygame>=2.6.1",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
geo = ["rasterio>=1.3"]
