[project]
name = "sandcam"
version = "0.1.0"
description = "AR sandbox POC — mouse-sculpted terrain with elevation rendering"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.4",
    "opencv-contrib-python>=4.11.0.86",
    "pygame>=2.6.1",
    "scipy>=1.17.1",
    "websockets>=12.0",
]

[project.optional-dependencies]
geo = ["rasterio>=1.3"]
kinect-v2 = ["pylibfreenect2>=0.1"]
orbbec = ["pyorbbecsdk>=1.0"]
realsense = ["pyrealsense2>=2.50"]
azure = ["pyk4a>=1.5"]
all-sensors = ["pylibfreenect2>=0.1", "pyorbbecsdk>=1.0", "pyrealsense2>=2.50", "pyk4a>=1.5"]
